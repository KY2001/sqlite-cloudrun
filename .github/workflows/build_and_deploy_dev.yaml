name: build_and_deploy_dev
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
concurrency:
  group: ${{ github.workflow }}
  queue: max
jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SERVER_PROJECT_ID: kein-432220
      SERVER_NAME: sqlite-cloudrun-dev
      SERVER_ENV: dev
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_DEV }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: beta
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.x
          terraform_wrapper: false
      - name: Terraform apply
        working-directory: terraform/environments/dev
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
      - name: Configure Docker for Artifact Registry
        run: make gcloud-ar-login
      - name: Build and push image
        run: make gcloud-build-and-push
      - name: Deploy to Cloud Run
        run: make gcloud-deploy
