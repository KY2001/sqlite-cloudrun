[package]
name = "sqlite-cloudrun"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
deadpool-sqlite = "0.14"
openapi = { path = "openapi" }
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
