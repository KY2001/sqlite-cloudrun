openapi: 3.1.0
info:
  title: SQL over HTTP
  version: 0.1.0
  description: Executes raw SQL against a SQLite database replicated to GCS with Litestream.
paths:
  /health:
    get:
      operationId: health
      summary: Check Litestream daemon responsiveness
      description: Queries the Litestream control socket with a three-second deadline.
      responses:
        "200":
          description: Litestream daemon is responsive
          content:
            application/json:
              schema:
                type: object
                properties:
                  litestream:
                    type: string
                    const: healthy
        "503":
          description: Litestream daemon is unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  litestream:
                    type: string
                    const: unavailable
  /sql:
    post:
      operationId: executeSql
      description: |
        Executes the SQL in the request body and returns the result rows. A query running longer
        than 30 seconds is interrupted with a 400. A 503 is returned if no database connection
        becomes available within 5 seconds.
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
            example: SELECT id, name FROM users WHERE id = 1
      responses:
        "200":
          description: Statement executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
              example:
                columns: [id, name]
                rows: [[1, alice]]
                changes: 0
        "400":
          description: SQL error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 400
                message: "no such table: users"
        "503":
          description: No database connection available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                statusCode: 503
                message: Timeout occurred while waiting for a slot to become available
  /sync:
    post:
      operationId: syncReplica
      summary: Replicate to GCS
      description: |
        Pushes pending changes to GCS with `litestream sync -wait`. With request-based billing the
        instance has no CPU between requests, so call this periodically (e.g. from Cloud Scheduler).
      responses:
        "204":
          description: All changes are replicated
        "500":
          description: Litestream sync failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    Result:
      type: object
      required: [columns, rows, changes]
      properties:
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items:
              description: A SQLite value (integer, number, string or null). BLOBs are returned as lowercase hex strings.
        changes:
          type: integer
          format: int64
          description: Rows inserted, updated or deleted by the request.
    ErrorResponse:
      type: object
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
          description: HTTP status code.
        message:
          type: string
          description: Human-readable error message.
